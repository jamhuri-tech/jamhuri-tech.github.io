<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Latihan Trigonometri</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1f2933;--mu:#5b6770;--bd:#d5dce3;--bl:#16456b;--or:#e8703a;--ok:#1b8a5a;--okb:#e6f5ed;--no:#c0392b;--nob:#fbeceb}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--card:#19222b;--tx:#e8edf1;--mu:#9aa7b2;--bd:#31404d;--bl:#7db7e6;--or:#f08a57;--ok:#5fcf9a;--okb:#143326;--no:#f0897d;--nob:#3a1d1a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2rem 0;color:var(--bl)}.sub{color:var(--mu);font-size:.9rem;margin:0 0 .8rem}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin:.6rem 0 1rem}
.nav button{padding:6px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;font-size:.8rem;cursor:pointer}
.nav .cur{outline:2px solid var(--bl)}.nav .b{background:var(--okb);border-color:var(--ok)}.nav .s{background:var(--nob);border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.no{font-weight:700;color:var(--or);font-size:.85rem}.stem{margin:.3rem 0 .8rem;font-size:1.05rem}
.fig{text-align:center;margin:.4rem 0 .8rem}.fig svg{width:100%;max-width:480px;height:auto;background:#fff;border-radius:8px;border:1px solid var(--bd)}
.hint{font-size:.85rem;color:var(--mu);margin:.2rem 0 .6rem}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.o input{margin-top:5px;width:18px;height:18px;flex:none}
label.o.ok{background:var(--okb);border-color:var(--ok)}label.o.bad{background:var(--nob);border-color:var(--no)}
.ex{display:block;margin-top:6px;font-size:.92rem;color:var(--tx)}.tag{font-weight:700}
.ok .tag{color:var(--ok)}.bad .tag{color:var(--no)}
.sol{margin-top:12px;padding:12px;border-left:4px solid var(--or);background:var(--bg);border-radius:6px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{padding:10px 16px;border-radius:8px;border:1px solid var(--bl);background:var(--bl);color:#fff;font-size:1rem;cursor:pointer}
.row button.g{background:transparent;color:var(--bl)}.row button:disabled{opacity:.4;cursor:not-allowed}
.res{font-weight:700;margin-top:10px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tm{font:700 1.25rem ui-monospace,monospace;color:var(--bl)}.tm.lo{color:var(--no)}
.bar small{color:var(--mu)}
input.t{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem;margin:4px 0 10px}
.hist{font-size:.9rem;color:var(--mu);margin-top:12px}.hist td{padding:2px 10px 2px 0}
.msg{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
.nvd{margin:.4rem 0 .8rem}.nvd>summary{cursor:pointer;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-weight:600;color:var(--bl)}
.nvd .nav{margin:.5rem 0 0}button,label.o,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
@media(max-width:600px){.w{padding:10px}.card{padding:12px}.stem{font-size:1rem}.bar{padding:6px 10px;flex-wrap:nowrap}.bar small{display:none}.tm{font-size:1.15rem}
.nav{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}.nav button{padding:10px 0;font-size:.9rem}
.row{position:sticky;bottom:0;background:var(--card);padding:8px 0;margin:10px 0 0;gap:6px}.row button{flex:1 1 0;padding:12px 6px;font-size:.95rem;white-space:nowrap}#k{flex:1.7 1 0!important}
label.o{padding:12px 10px}label.o input{width:22px;height:22px}.katex{font-size:1.05em}.fig svg{max-width:100%}}
.row button.d{background:var(--no);border-color:var(--no)}
</style></head><body><div id="bar"></div><div class="w"><div id="app"></div></div>
